name: Convert Issue to PR

on:
  issues:
    types: [edited]
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check and parse issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels || [];
            const labelNames = labels.map(l => l.name);
            console.log('Issue labels:', labelNames);
            
            const body = context.payload.issue.body || '';
            console.log('Issue body length:', body.length);
            
            // check if the issue is a content-edit issue (Markdown files only)
            const hasContentEdit = labelNames.includes('content-edit');
            const hasYmlEdit = labelNames.includes('yml-edit');
            const hasFileField = body.includes('Which file do you want to edit');
            
            // Skip yml-edit issues - they are handled by update-yml-with-images.yml
            if (hasYmlEdit || body.includes('Which YAML file do you want to edit')) {
              console.log('Skipping: yml-edit issues are handled by update-yml-with-images.yml workflow');
              core.setOutput('should_run', 'false');
              return;
            }
            
            if (!hasContentEdit && !hasFileField) {
              console.log('Skipping: not a content-edit issue');
              core.setOutput('should_run', 'false');
              return;
            }
            
            // extract the file path (Markdown files only)
            const filePatterns = [
              /###\s*Which file do you want to edit\?\s*\n\s*([^\n]+)/i,
              /###\s*Which file do you want to edit\?\s*\n\n\s*([^\n]+)/i,
              /Editable sections from `([^`]+)`/i,
              /Prefilled Content from `([^`]+)`/i
            ];
            
            let filePath = null;
            for (const pattern of filePatterns) {
              const match = body.match(pattern);
              if (match && match[1]) {
                filePath = match[1].trim();
                break;
              }
            }
            
            const sectionUpdates = {};
            const sectionRe = /####\s*Section:\s*(\S+)[ \t]*\n(?:heading:[ \t]*(.*)[ \t]*\n)?```text\n([\s\S]*?)```/g;
            let sectionMatch;
            while ((sectionMatch = sectionRe.exec(body)) !== null) {
              sectionUpdates[sectionMatch[1].trim()] = {
                heading: (sectionMatch[2] || '').trim(),
                text: sectionMatch[3].replace(/\n$/, '')
              };
            }
            const hasSections = Object.keys(sectionUpdates).length > 0;

            const markdownMatch = body.match(/```markdown\s*\n([\s\S]*?)\n```/);
            const newContent = markdownMatch ? markdownMatch[1] : null;
            const isYaml = false;

            if (!filePath) {
              console.error('No file path found');
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '❌ Cannot find file path in issue. Please make sure the format is correct.'
              });
              core.setOutput('should_run', 'false');
              return;
            }

            if (!hasSections && !newContent) {
              console.error('No edited content found');
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '❌ Cannot find edited content. Please edit the `text` (or `markdown`) code blocks, then save.'
              });
              core.setOutput('should_run', 'false');
              return;
            }

            const editMode = hasSections ? 'sections' : 'full';
            console.log('✅ File path:', filePath);
            console.log('✅ Edit mode:', editMode);
            if (hasSections) {
              console.log('✅ CMS sections:', Object.keys(sectionUpdates).join(', '));
            } else {
              console.log('✅ New content length:', newContent.length);
            }

            core.setOutput('filePath', filePath);
            core.setOutput('editMode', editMode);
            core.setOutput('newContent', hasSections ? '' : newContent);
            core.setOutput('sectionsB64', Buffer.from(JSON.stringify(sectionUpdates), 'utf8').toString('base64'));
            core.setOutput('isYaml', 'false');
            core.setOutput('imageUrls', JSON.stringify([]));
            core.setOutput('should_run', 'true');

      - name: Checkout repository
        if: steps.parse.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Download and save images (Markdown files don't support image uploads)
        if: false
        id: images
        env:
          IMAGE_URLS: ${{ steps.parse.outputs.imageUrls }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const https = require('https');
            const http = require('http');
            const { promisify } = require('util');
            
            const imageUrls = JSON.parse(process.env.IMAGE_URLS || '[]');
            const savedImages = [];
            
            for (const imageUrl of imageUrls) {
              try {
                // extract the file name from the URL
                const urlParts = imageUrl.split('/');
                let fileName = urlParts[urlParts.length - 1].split('?')[0];
                
                // if there is no extension, try to infer the extension from the URL
                if (!fileName.match(/\.(jpg|jpeg|png|gif|svg|webp)$/i)) {
                  // check if the URL has extension information
                  const urlExtMatch = imageUrl.match(/\.(jpg|jpeg|png|gif|svg|webp)/i);
                  if (urlExtMatch) {
                    fileName = `image_${Date.now()}_${Math.random().toString(36).substr(2, 9)}${urlExtMatch[0]}`;
                  } else {
                    fileName = `image_${Date.now()}_${Math.random().toString(36).substr(2, 9)}.png`;
                  }
                }
                
                // determine the save path (assets/img/)
                const saveDir = 'assets/img';
                if (!fs.existsSync(saveDir)) {
                  fs.mkdirSync(saveDir, { recursive: true });
                }
                
                const savePath = path.join(saveDir, fileName);
                
                // download the image
                const protocol = imageUrl.startsWith('https') ? https : http;
                await new Promise((resolve, reject) => {
                  const request = protocol.get(imageUrl, (response) => {
                    if (response.statusCode === 200 || response.statusCode === 301 || response.statusCode === 302) {
                      // handle the redirection
                      if (response.statusCode === 301 || response.statusCode === 302) {
                        const redirectUrl = response.headers.location;
                        if (redirectUrl) {
                          const redirectProtocol = redirectUrl.startsWith('https') ? https : http;
                          redirectProtocol.get(redirectUrl, (redirectResponse) => {
                            const fileStream = fs.createWriteStream(savePath);
                            redirectResponse.pipe(fileStream);
                            fileStream.on('finish', () => {
                              fileStream.close();
                              console.log(`✅ Downloaded: ${savePath}`);
                              savedImages.push(`/${savePath}`);
                              resolve();
                            });
                          }).on('error', reject);
                          return;
                        }
                      }
                      
                      const fileStream = fs.createWriteStream(savePath);
                      response.pipe(fileStream);
                      fileStream.on('finish', () => {
                        fileStream.close();
                        console.log(`✅ Downloaded: ${savePath}`);
                        savedImages.push(`/${savePath}`);
                        resolve();
                      });
                    } else {
                      reject(new Error(`Failed to download: ${response.statusCode}`));
                    }
                  });
                  request.on('error', reject);
                });
              } catch (err) {
                console.error(`❌ Failed to download ${imageUrl}:`, err.message);
              }
            }
            
            core.setOutput('saved_paths', JSON.stringify(savedImages));
            core.setOutput('count', savedImages.length.toString());

      - name: Read original file and preserve front matter
        if: steps.parse.outputs.should_run == 'true'
        id: prepare
        env:
          FILE_PATH: ${{ steps.parse.outputs.filePath }}
          IS_YAML: ${{ steps.parse.outputs.isYaml }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const filePath = process.env.FILE_PATH;
            const isYaml = process.env.IS_YAML === 'true';
            
            if (!fs.existsSync(filePath)) {
              console.log('File not found:', filePath);
              core.setOutput('has_frontmatter', 'false');
              return;
            }
            
            // YAML files don't need front matter processing
            if (isYaml) {
              core.setOutput('has_frontmatter', 'false');
              return;
            }
            
            const content = fs.readFileSync(filePath, 'utf8');
            
            // Check if the file has front matter
            // Front matter format: ---\nkey: value\n---\n
            if (content.startsWith('---\n')) {
              // Find the position of the second ---
              const secondDashIndex = content.indexOf('\n---\n', 4);
              if (secondDashIndex > 0) {
                // Extract front matter (excluding the opening and closing ---)
                const frontmatter = content.substring(4, secondDashIndex);
                core.setOutput('has_frontmatter', 'true');
                core.setOutput('frontmatter', frontmatter);
                console.log('✅ Found front matter, length:', frontmatter.length);
                console.log('Front matter preview:', frontmatter.substring(0, 100));
              } else {
                console.log('⚠️ Found opening --- but no closing ---');
                core.setOutput('has_frontmatter', 'false');
              }
            } else {
              console.log('⚠️ File does not start with ---');
              core.setOutput('has_frontmatter', 'false');
            }

      - name: Create new file content
        if: steps.parse.outputs.should_run == 'true'
        env:
          FILE_PATH: ${{ steps.parse.outputs.filePath }}
          NEW_CONTENT: ${{ steps.parse.outputs.newContent }}
          EDIT_MODE: ${{ steps.parse.outputs.editMode }}
          SECTIONS_B64: ${{ steps.parse.outputs.sectionsB64 }}
          HAS_FRONTMATTER: ${{ steps.prepare.outputs.has_frontmatter }}
          FRONTMATTER: ${{ steps.prepare.outputs.frontmatter }}
          IS_YAML: ${{ steps.parse.outputs.isYaml }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const filePath = process.env.FILE_PATH;
            const newContent = process.env.NEW_CONTENT;
            const editMode = process.env.EDIT_MODE || 'full';
            const hasFrontmatter = process.env.HAS_FRONTMATTER === 'true';
            const frontmatter = process.env.FRONTMATTER || '';

            const dir = path.dirname(filePath);
            if (!fs.existsSync(dir)) {
              fs.mkdirSync(dir, { recursive: true });
            }

            let finalContent;

            if (editMode === 'sections') {
              const rawUpdates = JSON.parse(
                Buffer.from(process.env.SECTIONS_B64 || '', 'base64').toString('utf8') || '{}'
              );
              const updates = {};
              for (const [id, value] of Object.entries(rawUpdates)) {
                updates[id] = (value && typeof value === 'object')
                  ? { heading: value.heading || '', text: value.text || '' }
                  : { heading: '', text: String(value || '') };
              }
              console.log('Applying CMS section updates:', Object.keys(updates));

              const escapeHtml = (s) => String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

              const slug = (s) => String(s || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_|_$/g, '') || 'image';

              const isPlaceholder = (id, heading, text) => {
                const t = String(text || '').trim();
                if (!t) return true;
                if (t.startsWith('Write the new paragraph here')) return true;
                if (id === 'new_section_id' && (!heading || heading === 'New heading') && t.startsWith('Write the new paragraph here')) return true;
                return false;
              };

              const https = require('https');
              const http = require('http');
              const download = (url, destPath) => new Promise((resolve, reject) => {
                const get = url.startsWith('https') ? https : http;
                const req = get.get(url, (res) => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    return download(res.headers.location, destPath).then(resolve).catch(reject);
                  }
                  if (res.statusCode !== 200) {
                    reject(new Error(`HTTP ${res.statusCode} for ${url}`));
                    return;
                  }
                  const ct = res.headers['content-type'] || '';
                  const fileStream = fs.createWriteStream(destPath);
                  res.pipe(fileStream);
                  fileStream.on('finish', () => {
                    fileStream.close();
                    resolve(ct);
                  });
                  fileStream.on('error', reject);
                });
                req.on('error', reject);
              });

              const extFromType = (ct) => {
                if (ct.includes('png')) return 'png';
                if (ct.includes('jpeg') || ct.includes('jpg')) return 'jpg';
                if (ct.includes('gif')) return 'gif';
                if (ct.includes('webp')) return 'webp';
                if (ct.includes('svg')) return 'svg';
                return 'png';
              };

              const saveDir = 'assets/img';
              if (!fs.existsSync(saveDir)) fs.mkdirSync(saveDir, { recursive: true });

              for (const section of Object.values(updates)) {
                const imageRe = /!\[([^\]]*)\]\((https?:[^)\s]+)\)/g;
                let imgMatch;
                const replacements = [];
                while ((imgMatch = imageRe.exec(section.text)) !== null) {
                  const alt = imgMatch[1] || 'image';
                  const url = imgMatch[2];
                  const isRemote = /github\.com\/user-attachments|user-images\.githubusercontent\.com/i.test(url)
                    || /^https?:\/\//.test(url) && !url.includes('/assets/img/');
                  if (!isRemote) continue;
                  const base = slug(alt);
                  let dest = path.join(saveDir, `${base}.png`);
                  try {
                    const ct = await download(url, dest);
                    const ext = extFromType(ct);
                    const finalDest = path.join(saveDir, `${base}.${ext}`);
                    if (finalDest !== dest) {
                      if (fs.existsSync(finalDest)) fs.unlinkSync(finalDest);
                      fs.renameSync(dest, finalDest);
                      dest = finalDest;
                    }
                    const localPath = `../assets/img/${path.basename(dest)}`;
                    replacements.push({ from: imgMatch[0], to: `![${alt}](${localPath})` });
                    console.log(`✅ Saved image ${dest}`);
                  } catch (err) {
                    console.log(`⚠️ Could not download ${url}: ${err.message}`);
                  }
                }
                for (const { from, to } of replacements) {
                  section.text = section.text.split(from).join(to);
                }
              }

              const editableToHtml = (text) => {
                let s = escapeHtml(String(text || '').trim());
                s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" class="img-fluid my-3" />');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
                s = s.replace(/\n/g, '<br>\n        ');
                return s;
              };

              const rebuildSectionInner = (originalInner, editableText) => {
                const html = editableToHtml(editableText);
                const pMatch = originalInner.match(/<p\b[^>]*>/i);
                if (pMatch) {
                  const open = pMatch[0];
                  const start = originalInner.search(/<p\b[^>]*>/i);
                  const end = originalInner.lastIndexOf('</p>');
                  if (end > start) {
                    const before = originalInner.slice(0, start);
                    const after = originalInner.slice(end + 4);
                    return `${before}${open}\n        ${html}\n      </p>${after}`;
                  }
                }
                return `\n      <p class="alt-lead text-gray text-justify-between col-md-15 mx-auto">\n        ${html}\n      </p>\n      `;
              };

              const original = fs.readFileSync(filePath, 'utf8');
              const existingIds = new Set();
              const cmsIdRe = /<!--\s*CMS:section\s+id=([^\s]+)\s*-->/g;
              let idMatch;
              while ((idMatch = cmsIdRe.exec(original)) !== null) existingIds.add(idMatch[1]);

              let next = original.replace(
                /<!--\s*CMS:section\s+id=([^\s]+)\s*-->([\s\S]*?)<!--\s*\/CMS:section\s*-->/g,
                (full, id, inner) => {
                  if (!Object.prototype.hasOwnProperty.call(updates, id)) return full;
                  if (isPlaceholder(id, updates[id].heading, updates[id].text)) return full;
                  return `<!-- CMS:section id=${id} -->${rebuildSectionInner(inner, updates[id].text)}<!-- /CMS:section -->`;
                }
              );

              const updateHeading = (fileContent, sectionId, newHeading) => {
                if (!newHeading) return fileContent;
                const marker = `<!-- CMS:section id=${sectionId} -->`;
                const idx = fileContent.indexOf(marker);
                if (idx < 0) return fileContent;
                const before = fileContent.slice(0, idx);
                const h2Re = /<h2\b[^>]*>[\s\S]*?<\/h2>/gi;
                let last = null;
                let m;
                while ((m = h2Re.exec(before))) last = m;
                if (!last || !last[0].includes('aboutpage-subtitle')) return fileContent;
                if (idx - (last.index + last[0].length) > 400) return fileContent;
                const replaced = last[0].replace(/>([\s\S]*)<\/h2>/, `>${escapeHtml(newHeading)}</h2>`);
                return fileContent.slice(0, last.index) + replaced + fileContent.slice(last.index + last[0].length);
              };

              for (const [id, section] of Object.entries(updates)) {
                if (existingIds.has(id) && section.heading) {
                  next = updateHeading(next, id, section.heading);
                }
              }

              const newSectionHtml = (id, heading, text) => [
                `<h2 class="aboutpage-subtitle text-left mb-3 mt-lg-6">${escapeHtml(heading || id)}</h2>`,
                '<div class="col-md-12 animate-out mb-2">',
                `<!-- CMS:section id=${id} -->`,
                '<p class="alt-lead text-gray text-justify-between col-md-15 mx-auto">',
                editableToHtml(text),
                '</p>',
                '<!-- /CMS:section -->',
                '</div>'
              ].join('\n');

              for (const [rawId, section] of Object.entries(updates)) {
                if (existingIds.has(rawId)) continue;
                if (isPlaceholder(rawId, section.heading, section.text)) {
                  console.log(`⏭️ Skipping placeholder section ${rawId}`);
                  continue;
                }
                let id = rawId;
                if (id === 'new_section_id') {
                  id = 'about_' + slug(section.heading || 'new_section');
                }
                if (existingIds.has(id)) id = `${id}_${Date.now()}`;
                const block = newSectionHtml(id, section.heading, section.text);
                if (next.includes('<!-- Icon Links -->')) {
                  next = next.replace('<!-- Icon Links -->', `${block}\n<!-- Icon Links -->`);
                } else {
                  const lastClose = next.lastIndexOf('<!-- /CMS:section -->');
                  const afterDiv = lastClose >= 0 ? next.indexOf('</div>', lastClose) : -1;
                  if (afterDiv >= 0) {
                    next = next.slice(0, afterDiv + 6) + '\n' + block + next.slice(afterDiv + 6);
                  } else {
                    next += block;
                  }
                }
                existingIds.add(id);
                console.log(`✅ Added new CMS section ${id}`);
              }

              finalContent = next;
              console.log('✅ Patched CMS sections in place; layout unchanged');
            } else if (hasFrontmatter && frontmatter.trim()) {
              finalContent = `---\n${frontmatter}\n---\n${newContent}`;
              console.log('✅ Preserved front matter');
            } else {
              finalContent = newContent;
              console.log('⚠️ No front matter to preserve');
            }

            fs.writeFileSync(filePath, finalContent, 'utf8');
            console.log(`✅ File updated: ${filePath}`);

      - name: Create Pull Request
        if: steps.parse.outputs.should_run == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update ${{ steps.parse.outputs.filePath }} via issue #${{ github.event.issue.number }}"
          title: "Update ${{ steps.parse.outputs.filePath }}"
          body: |
            This PR was automatically created from issue #${{ github.event.issue.number }}.
            
            **Changes:**
            - Updated `${{ steps.parse.outputs.filePath }}`
            
            Please review and merge if everything looks good.
            
            ---
            Closes #${{ github.event.issue.number }}
          branch: "content-edit-issue-${{ github.event.issue.number }}"
          delete-branch: true
          labels: content-edit

