name: Prefill YAML Issue Content from Repo

on:
  issues:
    types: [opened]
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  prefill-yml:
    runs-on: ubuntu-latest
    steps:
      - name: Check label and parse YAML file
        id: check_and_parse
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels || [];
            const labelNames = labels.map(l => l.name);
            console.log('Issue labels:', labelNames);

            const hasYmlEdit = labelNames.includes('yml-edit');
            const hasUpload = labelNames.includes('upload-image');
            const body = context.payload.issue.body || '';

            if (hasUpload) {
              console.log('Skipping: this is an upload issue, handled by issue-upload-image.yml');
              core.setOutput('should_run', 'false');
              return;
            }

            const hasYamlFileField = body.includes('Which YAML file do you want to edit');
            if (!hasYmlEdit && !hasYamlFileField) {
              console.log('Skipping: no yml-edit label and no YAML file field in body');
              core.setOutput('should_run', 'false');
              return;
            }

            let filePath = null;
            const patterns = [
              /###\s*Which YAML file do you want to edit\?\s*\n\s*([^\n]+)/i,
              /###\s*Which YAML file do you want to edit\?\s*\n\n\s*([^\n]+)/i,
              /Which YAML file do you want to edit[?？]\s*\n\s*([^\n]+)/i,
              /Which YAML file do you want to edit[?？]\s*\n\n\s*([^\n]+)/i
            ];
            for (const pattern of patterns) {
              const match = body.match(pattern);
              if (match && match[1]) {
                filePath = match[1].trim();
                if (filePath.endsWith('.yml') || filePath.endsWith('.yaml')) break;
              }
            }

            if (!filePath) {
              console.error('No YAML file path found in issue body');
              core.setOutput('should_run', 'false');
              return;
            }

            console.log('Parsed YAML file path:', filePath);
            core.setOutput('should_run', 'true');
            core.setOutput('filePath', filePath);

      - name: Checkout repository
        if: steps.check_and_parse.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Checkout YAML helper scripts
        if: steps.check_and_parse.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: energy-modelling-tools/.github
          ref: experiment/maed-plain-prefill
          path: .emt-scripts

      - name: Build editable YAML blocks
        if: steps.check_and_parse.outputs.should_run == 'true'
        id: build
        env:
          FILE_PATH: ${{ steps.check_and_parse.outputs.filePath }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .emt-scripts/.github/scripts/yaml_to_issue.py "$FILE_PATH" > "$RUNNER_TEMP/yml_prefill.md"

      - name: Update issue with editable items
        if: steps.check_and_parse.outputs.should_run == 'true'
        env:
          FILE_PATH: ${{ steps.check_and_parse.outputs.filePath }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.issue.number;
            const filePath = process.env.FILE_PATH;
            const prefillPath = `${process.env.RUNNER_TEMP}/yml_prefill.md`;

            try {
              if (!fs.existsSync(prefillPath)) {
                throw new Error('Prefill markdown was not generated');
              }
              const itemsMarkdown = fs.readFileSync(prefillPath, 'utf8');
              let originalBody = context.payload.issue.body || '';

              const yamlContentPattern = /(###\s*YAML Content\s*\n\n?)([\s\S]*?)(?=\n### |\n---|$)/i;
              if (yamlContentPattern.test(originalBody)) {
                originalBody = originalBody.replace(
                  yamlContentPattern,
                  '$1_Filled below as one editable box per item. Drag photos inside each event or partner text block._\n\n'
                );
              }

              const newBody = originalBody.replace(/\s+$/, '') + '\n\n---\n\n' + itemsMarkdown;
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                body: newBody
              });
              console.log(`Updated issue #${issue_number} with editable YAML items from ${filePath}`);
            } catch (err) {
              console.error(`Failed to prefill YAML file: ${filePath}`, err);
              const originalBody = context.payload.issue.body || '';
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                body: originalBody + `\n\n---\n\n⚠️ Unable to find or read YAML file: \`${filePath}\`\n\nError: ${err.message}`
              });
            }
