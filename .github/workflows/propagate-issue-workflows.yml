name: Propagate Issue Workflows to Repos

on:
  push:
    branches: [main]
    paths:
      - 'workflow-templates/issue-content-handler.yml'
      - '.github/workflows/propagate-issue-workflows.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
  schedule:
    # Re-sync the caller workflow weekly so new org repos pick it up
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PAGE_TEMPLATE_APP_ID }}
          private-key: ${{ secrets.PAGE_TEMPLATE_APP_PRIVATE_KEY }}
          owner: energy-modelling-tools

      - name: Propagate calling workflow and managed issue forms to org repos
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: energy-modelling-tools
        run: |
          python3 - << 'PYEOF'
          import base64, json, os, sys, urllib.parse, urllib.request, urllib.error

          TOKEN = os.environ["TOKEN"]
          ORG = os.environ["ORG"]
          WORKFLOW_FILE = "workflow-templates/issue-content-handler.yml"
          TARGET_PATH = ".github/workflows/issue-content-handler.yml"
          LEGACY_PATH = ".github/workflows/workflowcalls.yml"
          COMMIT_MSG = "Add/update issue content handler workflow from org template"
          SKIP_REPOS = {".github", "page-template"}

          # A repo holding its own .github/ISSUE_TEMPLATE/ no longer inherits the
          # org defaults, so its forms are synced from here instead - but only the
          # ones still carrying MANAGED_MARKER. CLEWs and the hub list their own
          # data files in theirs, so those copies are left alone.
          TEMPLATE_DIR = ".github/ISSUE_TEMPLATE"
          MANAGED_TEMPLATES = ["edit-content.yml", "edit-yml.yml", "upload-images.yml"]
          MANAGED_MARKER = "# emt:managed-template"

          def read_b64(path):
              with open(path, "rb") as f:
                  return base64.b64encode(f.read()).decode("ascii")

          content = read_b64(WORKFLOW_FILE)
          templates = {name: read_b64(f"{TEMPLATE_DIR}/{name}") for name in MANAGED_TEMPLATES}

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, url, payload=None):
              data = None
              req_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  req_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read()
                      return resp.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(body)
                  except json.JSONDecodeError:
                      parsed = {"message": body}
                  return e.code, parsed

          def list_org_repos():
              repos = []
              page = 1
              while True:
                  url = (
                      f"https://api.github.com/orgs/{ORG}/repos"
                      f"?per_page=100&page={page}&type=all&sort=full_name"
                  )
                  status, data = api("GET", url)
                  if status != 200:
                      raise RuntimeError(f"Failed to list org repos (HTTP {status}): {data}")
                  if not data:
                      break
                  repos.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
              return repos

          def contents_url(repo, path):
              encoded = urllib.parse.quote(path)
              return f"https://api.github.com/repos/{repo}/contents/{encoded}"

          org_repos = list_org_repos()
          targets = []
          for repo in org_repos:
              name = repo.get("name")
              if name in SKIP_REPOS:
                  print(f"⏭️  Skipping {ORG}/{name}")
                  continue
              if repo.get("archived"):
                  print(f"⏭️  Skipping archived {ORG}/{name}")
                  continue
              targets.append(f"{ORG}/{name}")

          print(f"Syncing {TARGET_PATH} to {len(targets)} repos")

          failures = {}

          def sync_managed_templates(repo):
              status, listing = api("GET", contents_url(repo, TEMPLATE_DIR))
              if status == 404:
                  print(f"   ↪️  {repo} inherits the org issue forms")
                  return
              if status != 200:
                  print(f"   ❌ Failed to list {TEMPLATE_DIR} in {repo} (HTTP {status}): {listing}")
                  failures[f"{repo}:{TEMPLATE_DIR}"] = f"GET HTTP {status}: {listing}"
                  return
              local = {item.get("name") for item in listing if isinstance(item, dict)}
              for name in MANAGED_TEMPLATES:
                  path = f"{TEMPLATE_DIR}/{name}"
                  if name not in local:
                      print(f"   ⚠️  {repo} keeps its own forms but has no {name}; add it by hand if that form is wanted")
                      continue
                  url = contents_url(repo, path)
                  status, existing = api("GET", url)
                  if status != 200:
                      print(f"   ❌ Failed to read {path} in {repo} (HTTP {status}): {existing}")
                      failures[f"{repo}:{path}"] = f"GET HTTP {status}: {existing}"
                      continue
                  encoded = existing.get("content", "").replace("\n", "")
                  current = base64.b64decode(encoded).decode("utf-8", errors="replace")
                  if MANAGED_MARKER not in current:
                      print(f"   🔒 {repo} has a local variant of {name}; leaving it alone")
                      continue
                  if encoded == templates[name]:
                      print(f"   ⏭️  {name} already current in {repo}")
                      continue
                  put_status, put_body = api("PUT", url, {
                      "message": f"Update {name} issue form from org template",
                      "content": templates[name],
                      "sha": existing.get("sha"),
                  })
                  if put_status in (200, 201):
                      print(f"   ✅ Updated {path} in {repo}")
                  else:
                      print(f"   ❌ Failed to update {path} in {repo} (HTTP {put_status}): {put_body}")
                      failures[f"{repo}:{path}"] = f"PUT HTTP {put_status}: {put_body}"

          for repo in targets:
              url = contents_url(repo, TARGET_PATH)
              sha = None
              status, existing = api("GET", url)
              if status == 200:
                  sha = existing.get("sha")
                  existing_content = existing.get("content", "").replace("\n", "")
                  if existing_content == content:
                      print(f"⏭️  No change needed for {repo}")
                  else:
                      payload = {"message": COMMIT_MSG, "content": content, "sha": sha}
                      put_status, put_body = api("PUT", url, payload)
                      if put_status in (200, 201):
                          print(f"✅ Updated {repo}")
                      else:
                          print(f"❌ Failed to update {repo} (HTTP {put_status}): {put_body}")
                          failures[repo] = f"PUT HTTP {put_status}: {put_body}"
              elif status == 404:
                  payload = {"message": COMMIT_MSG, "content": content}
                  put_status, put_body = api("PUT", url, payload)
                  if put_status in (200, 201):
                      print(f"✅ Created {repo}")
                  else:
                      print(f"❌ Failed to create {repo} (HTTP {put_status}): {put_body}")
                      failures[repo] = f"PUT HTTP {put_status}: {put_body}"
              else:
                  print(f"❌ Failed to check {repo}: HTTP {status}: {existing}")
                  failures[repo] = f"GET HTTP {status}: {existing}"
                  continue

              # Remove the old per-repo caller so issues are not handled twice
              legacy_url = contents_url(repo, LEGACY_PATH)
              legacy_status, legacy = api("GET", legacy_url)
              if legacy_status == 200:
                  del_status, del_body = api(
                      "DELETE",
                      legacy_url,
                      {
                          "message": "Remove legacy workflowcalls.yml; replaced by issue-content-handler.yml",
                          "sha": legacy.get("sha"),
                      },
                  )
                  if del_status in (200, 201):
                      print(f"🧹 Removed {LEGACY_PATH} from {repo}")
                  else:
                      print(f"❌ Failed to remove {LEGACY_PATH} from {repo} (HTTP {del_status}): {del_body}")
                      failures[repo] = f"DELETE HTTP {del_status}: {del_body}"

              sync_managed_templates(repo)

          if failures:
              print("\nFailed repos and reasons:")
              for repo, reason in failures.items():
                  print(f"  {repo}: {reason}")
              sys.exit(1)
          PYEOF
