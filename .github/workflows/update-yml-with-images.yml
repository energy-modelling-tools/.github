name: Update YAML File with Images

on:
  issues:
    types: [edited]
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-yml:
    runs-on: ubuntu-latest
    steps:
      - name: Check and parse YAML issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor || '';
            const senderType = (context.payload.sender && context.payload.sender.type) || '';
            if (actor === 'github-actions[bot]' || senderType === 'Bot') {
              console.log('Skipping bot edit (prefill or automation)');
              core.setOutput('should_run', 'false');
              return;
            }

            const labels = context.payload.issue.labels || [];
            const labelNames = labels.map(l => l.name);
            const body = context.payload.issue.body || '';

            const hasYmlEdit = labelNames.includes('yml-edit');
            const hasYamlFileField = body.includes('Which YAML file do you want to edit');
            if (!hasYmlEdit && !hasYamlFileField) {
              console.log('Skipping: not a yml-edit issue');
              core.setOutput('should_run', 'false');
              return;
            }

            const filePatterns = [
              /###\s*Which YAML file do you want to edit\?\s*\n\s*([^\n]+)/i,
              /###\s*Which YAML file do you want to edit\?\s*\n\n\s*([^\n]+)/i,
              /Editable items from `([^`]+)`/i,
              /Prefilled YAML Content from `([^`]+)`/i,
              /Prefilled Content from `([^`]+)`/i
            ];
            let filePath = null;
            for (const pattern of filePatterns) {
              const match = body.match(pattern);
              if (match && match[1]) {
                const candidate = match[1].trim().replace(/\s*\([^)]*\)\s*$/, '').trim();
                if (candidate.endsWith('.yml') || candidate.endsWith('.yaml')) {
                  filePath = candidate;
                  break;
                }
              }
            }

            const parseFields = (text) => {
              const obj = {};
              const outputs = [];
              let mode = null;
              const lines = String(text || '').replace(/\n$/, '').split('\n');
              for (const raw of lines) {
                const line = raw.replace(/\r$/, '');
                if (/^outputs:\s*$/i.test(line)) { mode = 'outputs'; continue; }
                if (/^image:\s*$/i.test(line)) { mode = 'image'; continue; }
                if (/^logo:\s*$/i.test(line)) { mode = 'logo'; continue; }

                if (mode === 'outputs') {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed === '(none)') continue;
                  const row = trimmed.match(/^[-*]\s*(.*?)\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|\s*(.*)$/);
                  if (row) {
                    outputs.push({
                      country: row[1].trim(),
                      flag: row[2].trim(),
                      title: row[3].trim(),
                      url: row[4].trim()
                    });
                  }
                  continue;
                }

                if (mode === 'image' || mode === 'logo') {
                  const img = line.match(/!\[([^\]]*)\]\(\s*<?["']?([^)\s"'<>]+)["']?>?\s*\)/);
                  const trimmed = line.trim();
                  if (img) obj[mode] = img[2].trim();
                  else if (trimmed && !trimmed.startsWith('(') && !/^(drag |paste )/i.test(trimmed)) obj[mode] = trimmed;
                  if (mode === 'image' && !obj.alt && img && img[1]) obj.alt = img[1].trim();
                  continue;
                }

                const kv = line.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*:\s*(.*)$/);
                if (!kv) continue;
                const key = kv[1].toLowerCase();
                const rest = kv[2].trim();
                if (key === 'image' || key === 'logo' || key === 'outputs') {
                  mode = key;
                  if (rest && key !== 'outputs') {
                    const img = rest.match(/!\[([^\]]*)\]\(\s*<?["']?([^)\s"'<>]+)["']?>?\s*\)/);
                    obj[key] = img ? img[2].trim() : rest;
                    if (key === 'image' && img && img[1] && !obj.alt) obj.alt = img[1].trim();
                  }
                  continue;
                }
                mode = null;
                obj[key] = rest;
              }
              if (outputs.length) obj.outputs = outputs;
              return obj;
            };

            const collect = (kind) => {
              const re = new RegExp('####\\s*' + kind + ':\\s*(.*)\\n```text\\n([\\s\\S]*?)```', 'gi');
              const items = [];
              let match;
              while ((match = re.exec(body)) !== null) {
                items.push({ heading: (match[1] || '').trim(), fields: parseFields(match[2]) });
              }
              return items;
            };

            const isUnchangedTemplate = (kind, heading, fields) => {
              const title = fields.title || '';
              const url = fields.url || '';
              const description = fields.description || '';
              const image = fields.image || '';
              const logo = fields.logo || '';
              if (kind === 'Event' && heading === 'new_event') {
                return title === 'EMP-A 2026 - City, Country'
                  || description.startsWith('Write a short description')
                  || image.includes('paste-or-drag');
              }
              if (kind === 'Adjacent' && heading === 'new_adjacent') {
                return url === 'https://example.com' || title === 'Training title';
              }
              if (kind === 'Publication' && heading === 'new_publication') {
                return title === 'New paper title';
              }
              if (kind === 'Partner' && heading === 'new_partner') {
                return url === 'https://example.org' || logo.includes('paste-or-drag');
              }
              if (kind === 'Link' && heading === 'new_link') {
                return url === 'https://example.com' || title === 'Bluesky' || fields.name === 'Bluesky';
              }
              return false;
            };

            const events = collect('Event')
              .filter((item) => !isUnchangedTemplate('Event', item.heading, item.fields))
              .map((item) => item.fields);
            const adjacent = collect('Adjacent')
              .filter((item) => !isUnchangedTemplate('Adjacent', item.heading, item.fields))
              .map((item) => item.fields);
            const publications = collect('Publication')
              .filter((item) => !isUnchangedTemplate('Publication', item.heading, item.fields))
              .map((item) => item.fields);
            const partners = collect('Partner')
              .filter((item) => !isUnchangedTemplate('Partner', item.heading, item.fields))
              .map((item) => item.fields);
            const links = collect('Link')
              .filter((item) => !isUnchangedTemplate('Link', item.heading, item.fields))
              .map((item) => item.fields);

            const hasBlocks = events.length + adjacent.length + publications.length + partners.length + links.length > 0;

            let yamlContent = '';
            if (!hasBlocks) {
              const yamlField = body.match(/###\s*YAML Content\s*\n\n?\s*```yaml\s*\n([\s\S]*?)\n```/i);
              const yamlFence = body.match(/```yaml\s*\n([\s\S]*?)\n```/);
              yamlContent = ((yamlField && yamlField[1]) || (yamlFence && yamlFence[1]) || '').trim();
            }

            if (!filePath) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '❌ Cannot find YAML file path in issue. Please make sure the format is correct.'
              });
              core.setOutput('should_run', 'false');
              return;
            }

            if (!hasBlocks && !yamlContent) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '❌ Cannot find editable YAML items. Edit a `text` block (or a `yaml` block), then save.'
              });
              core.setOutput('should_run', 'false');
              return;
            }

            const payload = {
              file: filePath,
              events,
              adjacent,
              publications,
              partners,
              links
            };
            console.log('YAML file path:', filePath);
            console.log('Edit mode:', hasBlocks ? 'blocks' : 'raw-yaml');
            if (hasBlocks) {
              console.log('Events:', events.length, 'Adjacent:', adjacent.length, 'Publications:', publications.length, 'Partners:', partners.length, 'Links:', links.length);
            }

            core.setOutput('filePath', filePath);
            core.setOutput('editMode', hasBlocks ? 'blocks' : 'raw');
            core.setOutput('payloadB64', Buffer.from(JSON.stringify(payload), 'utf8').toString('base64'));
            core.setOutput('yamlContent', hasBlocks ? '' : yamlContent);
            core.setOutput('should_run', 'true');

      - name: Checkout repository
        if: steps.parse.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Checkout YAML helper scripts
        if: steps.parse.outputs.should_run == 'true' && steps.parse.outputs.editMode == 'blocks'
        uses: actions/checkout@v4
        with:
          repository: energy-modelling-tools/.github
          ref: main
          path: .emt-scripts

      - name: Apply editable YAML blocks
        if: steps.parse.outputs.should_run == 'true' && steps.parse.outputs.editMode == 'blocks'
        env:
          PAYLOAD_B64: ${{ steps.parse.outputs.payloadB64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMT_REPORT_DIR: ${{ runner.temp }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - << 'PY'
          import base64, os, pathlib, subprocess, sys
          raw = os.environ["PAYLOAD_B64"]
          payload = base64.b64decode(raw)
          script = pathlib.Path(".emt-scripts/.github/scripts/apply_yml_issue.py")
          subprocess.run([sys.executable, str(script)], input=payload, check=True)
          PY

      - name: Write raw YAML content
        if: steps.parse.outputs.should_run == 'true' && steps.parse.outputs.editMode == 'raw'
        env:
          FILE_PATH: ${{ steps.parse.outputs.filePath }}
          YAML_CONTENT: ${{ steps.parse.outputs.yamlContent }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const filePath = process.env.FILE_PATH;
            const dir = path.dirname(filePath);
            if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(filePath, process.env.YAML_CONTENT, 'utf8');
            console.log('YAML file updated from raw yaml block:', filePath);

      - name: Report images that could not be saved
        if: steps.parse.outputs.should_run == 'true' && steps.parse.outputs.editMode == 'blocks'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = `${process.env.RUNNER_TEMP}/image_failures.txt`;
            if (!fs.existsSync(reportPath)) return;
            const lines = fs.readFileSync(reportPath, 'utf8').split('\n').filter(Boolean);
            if (lines.length === 0) return;
            const body = [
              '⚠️ Your text was saved, but these images could not be downloaded, so the previous picture was kept:',
              '',
              ...lines.map((line) => '- ' + line),
              '',
              'Please re-drag the image inside that block and save again. Make sure the URL has no quotes around it.'
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Remove helper checkout
        if: steps.parse.outputs.should_run == 'true'
        run: rm -rf .emt-scripts uploaded_files.txt image_failures.txt

      - name: Create Pull Request
        if: steps.parse.outputs.should_run == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update ${{ steps.parse.outputs.filePath }} via issue #${{ github.event.issue.number }}"
          title: "Update ${{ steps.parse.outputs.filePath }}"
          body: |
            This PR was automatically created from issue #${{ github.event.issue.number }}.

            **Changes:**
            - Updated `${{ steps.parse.outputs.filePath }}`
            - EMP photos are saved to `assets/img/EMP/`
            - Partner logos are saved to `assets/img/partners/`

            Please review and merge if everything looks good.

            ---
            Closes #${{ github.event.issue.number }}
          branch: "yml-edit-issue-${{ github.event.issue.number }}"
          delete-branch: true
          labels: yml-edit
