name: Prefill Issue Content from Repo

on:
  issues:
    types: [opened]
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  prefill:
    runs-on: ubuntu-latest
    steps:
      - name: Check label and parse file
        id: check_and_parse
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels || [];
            const labelNames = labels.map(l => l.name);
            console.log('Issue labels:', labelNames);
            
            // Check if the issue has content-edit label (Markdown files only)
            const hasContentEdit = labelNames.includes('content-edit');
            const hasYmlEdit = labelNames.includes('yml-edit');
            const hasUpload = labelNames.includes('upload-image');
            const body = context.payload.issue.body || '';
            console.log('Full issue body:', body);
            
            // Skip upload issues - they are handled by issue-upload-image.yml
            if (hasUpload) {
              console.log('Skipping: this is an upload issue, handled by issue-upload-image.yml');
              core.setOutput('should_run', 'false');
              return;
            }
            
            // Skip yml-edit issues - they are handled by prefill-yml-content.yml
            if (hasYmlEdit || body.includes('Which YAML file do you want to edit')) {
              console.log('Skipping: this is a yml-edit issue, handled by prefill-yml-content.yml');
              core.setOutput('should_run', 'false');
              return;
            }
            
            const hasFileField = body.includes('Which file do you want to edit');
            
            if (!hasContentEdit && !hasFileField) {
              console.log('Skipping: no content-edit label and no file field in body');
              core.setOutput('should_run', 'false');
              return;
            }
            
            // Extract file path from issue body (Markdown files only)
            // GitHub forms format might be: ### Which file do you want to edit?\n\nvalue\n
            let filePath = null;
            
            // Try multiple matching patterns
            const patterns = [
              /###\s*Which file do you want to edit\?\s*\n\s*([^\n]+)/i,
              /###\s*Which file do you want to edit\?\s*\n\n\s*([^\n]+)/i,
              /Which file do you want to edit[?？]\s*\n\s*([^\n]+)/i,
              /Which file do you want to edit[?？]\s*\n\n\s*([^\n]+)/i
            ];
            
            for (const pattern of patterns) {
              const match = body.match(pattern);
              if (match && match[1]) {
                filePath = match[1].trim().replace(/\s*\([^)]*\)\s*$/, '').trim();
                break;
              }
            }
            
            if (!filePath) {
              console.error('No file path found in issue body');
              console.log('Body content:', JSON.stringify(body));
              core.setOutput('should_run', 'false');
              return;
            }
            
            // This workflow only handles Markdown files
            const isYaml = false;
            
            console.log('✅ Parsed Markdown file path:', filePath);
            core.setOutput('should_run', 'true');
            core.setOutput('filePath', filePath);
            core.setOutput('isYaml', 'false');

      - name: Checkout repository
        if: steps.check_and_parse.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Read file content and update issue
        if: steps.check_and_parse.outputs.should_run == 'true'
        env:
          IS_YAML: ${{ steps.check_and_parse.outputs.isYaml }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.issue.number;
            const filePath = '${{ steps.check_and_parse.outputs.filePath }}';
            const isYaml = process.env.IS_YAML === 'true';
            
            console.log(`Attempting to read Markdown file: ${filePath}`);
            
            try {
              // Check if the file exists
              if (!fs.existsSync(filePath)) {
                throw new Error(`File not found: ${filePath}`);
              }
              
              let content = fs.readFileSync(filePath, 'utf8');
              console.log(`Markdown file read successfully, length: ${content.length} characters`);

              const decodeEntities = (s) => s
                .replace(/&nbsp;/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/&#39;/g, "'");

              const htmlToEditable = (html) => {
                const inlineFormat = (chunk) => {
                  let s = String(chunk || '');
                  s = s.replace(/<strong>([\s\S]*?)<\/strong>/gi, '**$1**');
                  s = s.replace(/<b>([\s\S]*?)<\/b>/gi, '**$1**');
                  s = s.replace(/<em>([\s\S]*?)<\/em>/gi, '*$1*');
                  s = s.replace(/<i>([\s\S]*?)<\/i>/gi, '*$1*');
                  s = s.replace(/<a\b[^>]*href=["']\s*([^"']+?)\s*["'][^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
                  s = s.replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, '$1');
                  s = s.replace(/<[^>]+>/g, '');
                  return decodeEntities(s).replace(/\s+/g, ' ').trim();
                };
                let s = String(html || '').trim();
                s = s.replace(/<li\b[^>]*>([\s\S]*?)<\/li>/gi, (_, inner) => `\n- ${inlineFormat(inner)}`);
                s = s.replace(/<\/p>\s*<p\b[^>]*>/gi, '\n\n');
                s = s.replace(/<p\b[^>]*>/gi, '').replace(/<\/p>/gi, '');
                s = s.replace(/<br\s*\/?>/gi, '\n');
                s = s.replace(/<strong>([\s\S]*?)<\/strong>/gi, '**$1**');
                s = s.replace(/<b>([\s\S]*?)<\/b>/gi, '**$1**');
                s = s.replace(/<em>([\s\S]*?)<\/em>/gi, '*$1*');
                s = s.replace(/<i>([\s\S]*?)<\/i>/gi, '*$1*');
                s = s.replace(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
                s = s.replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, '$1');
                s = s.replace(/<img\b[^>]*>/gi, (tag) => {
                  const src = (tag.match(/src=["']([^"']+)["']/) || [])[1] || '';
                  const alt = (tag.match(/alt=["']([^"']+)["']/) || [])[1] || 'image';
                  return src ? `\n![${alt}](${src})\n` : '';
                });
                s = s.replace(/<[^>]+>/g, '');
                s = decodeEntities(s);
                return s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]{2,}/g, ' ').trim();
              };

              const cmsSections = [];
              const cmsRe = /<!--\s*CMS:section\s+id=([^\s]+)\s*-->([\s\S]*?)<!--\s*\/CMS:section\s*-->/g;
              let cmsMatch;
              while ((cmsMatch = cmsRe.exec(content)) !== null) {
                const before = content.slice(0, cmsMatch.index);
                const headings = [...before.matchAll(/<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1>/gi)];
                let heading = '';
                let link = '';
                if (headings.length) {
                  const last = headings[headings.length - 1];
                  const dist = cmsMatch.index - (last.index + last[0].length);
                  if (dist < 500) {
                    heading = htmlToEditable(last[2]);
                    const beforeH = before.slice(0, last.index);
                    const aTags = [...beforeH.matchAll(/<a\b[^>]*href=["']\s*([^"']+?)\s*["'][^>]*>/gi)];
                    if (aTags.length) {
                      const a = aTags[aTags.length - 1];
                      const afterA = beforeH.slice(a.index + a[0].length);
                      if (!afterA.includes('</a>')) link = a[1].trim();
                    }
                  }
                }
                cmsSections.push({
                  id: cmsMatch[1].trim(),
                  heading,
                  link,
                  text: htmlToEditable(cmsMatch[2])
                });
              }

              const originalBody = context.payload.issue.body || '';
              let header;
              let prefilledContent;
              let instructions;

              if (cmsSections.length > 0) {
                console.log(`✅ Found ${cmsSections.length} CMS sections; prefilling plain text only`);
                header = `\n\n---\n\n### 🧾 Editable sections from \`${filePath}\`\n\n`;
                const existingBlocks = cmsSections.map((section) => {
                  const lines = [`#### Section: ${section.id}`];
                  lines.push(`heading: ${section.heading || ''}`);
                  if (section.link) lines.push(`link: ${section.link}`);
                  lines.push('```text', section.text, '```', '');
                  return lines.join('\n');
                }).join('\n');
                const newSectionTemplate = [
                  '### Add a new section (optional)',
                  '',
                  'Copy the block below to add another heading + paragraph. Change `new_section_id`. Duplicate the block to add more than one. Leave it unchanged to skip.',
                  '',
                  'To **delete** a section, remove that whole `#### Section:` block (the `heading:` line and its text box).',
                  '',
                  '#### Section: new_section_id',
                  'heading: New heading',
                  '```text',
                  'Write the new paragraph here.',
                  '',
                  'To add a picture: drag the file into this box (inside the text fence).',
                  'GitHub will insert something like ![image](https://github.com/user-attachments/assets/xxxx).',
                  'Change `image` to a short filename. Do not put quotes around the URL.',
                  '```',
                  ''
                ].join('\n');
                prefilledContent = existingBlocks + '\n' + newSectionTemplate + '\n';
                instructions = [
                  '> 📝 **How to edit:**',
                  '> 1. Click the **three dots (···)** in the top right corner and choose **Edit**',
                  '> 2. `heading:` is the title on the page — edit it there',
                  '> 3. Change the words inside each ` ```text ` block',
                  '> 4. Keep existing `#### Section:` ids as they are',
                  '> 5. **Delete a section:** remove that whole `#### Section:` block',
                  '> 6. Links: `[visible text](https://example.com)` · Bold: `**like this**`',
                  '> 7. Images: put the cursor **inside** a ` ```text ` block, drag the file in, then change `![image](url)` to `![short-name](url)` — no quotes around the URL',
                  '> 8. New section: fill in the optional block at the bottom',
                  '> 9. Click **Update comment** — a Pull Request will be created automatically',
                  '',
                  '> Layout HTML is kept in the file. You are editing titles, wording, links, and images.'
                ].join('\n');
              } else {
                if (content.trim().startsWith('---')) {
                  const parts = content.split(/^---$/m);
                  if (parts.length >= 3) {
                    content = parts.slice(2).join('---').trim();
                    console.log('Removed front matter, remaining length:', content.length);
                  }
                }
                console.log('✅ No CMS sections; prefilling full file');
                header = `\n\n---\n\n### 🧾 Prefilled Content from \`${filePath}\`\n\n`;
                prefilledContent = '```markdown\n' + content + '\n```\n\n';
                instructions = [
                  '> 📝 **How to edit:**',
                  '> 1. Click the **three dots (···)** in the top right corner',
                  '> 2. Select **"Edit"**',
                  '> 3. Edit the content in the code block above (between \\`\\`\\`markdown and \\`\\`\\`)',
                  '> 4. Click **"Update comment"** to save',
                  '> 5. The system will automatically create a Pull Request',
                  '',
                  '> ⚠️ **Important:** Only edit the content inside the code block, do not delete the \\`\\`\\`markdown markers!'
                ].join('\n');
              }

              const newBody = originalBody + header + prefilledContent + instructions;
              
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                body: newBody
              });
              
              console.log(`✅ Updated issue #${issue_number} with content from ${filePath}`);
            } catch (err) {
              console.error(`❌ Failed to read file: ${filePath}`, err);
              const originalBody = context.payload.issue.body || '';
              const failBody = originalBody + `\n\n---\n\n⚠️ Unable to find or read file: \`${filePath}\`\n\nError: ${err.message}`;
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                body: failBody
              });
            }

